<!doctype html>
<html><head><meta charset="utf-8"><title>Visor preview source</title>
<style>
  @font-face{font-family:"Orbitron";font-weight:700;src:url(../../assets/fonts/orbitron-bold.ttf)}
  @font-face{font-family:"OrbitronM";font-weight:500;src:url(../../assets/fonts/orbitron-medium.ttf)}
  @font-face{font-family:"Rajdhani";font-weight:600;src:url(../../assets/fonts/rajdhani-semibold-latin.ttf)}
  @font-face{font-family:"ShareTech";font-weight:400;src:url(../../assets/fonts/share-tech-mono.ttf)}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07040D}
  canvas{position:absolute;left:0;top:0}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="draw.js"></script>
<script>
fonts(function(){
sky();
// sun and stars (layer 0, parallax 0.1)
c.fillStyle=rgba(TEXT,.5);seed=5;for(let i=0;i<70;i++){c.fillRect(rnd()*1920,rnd()*420,2,2);}
const sg=c.createLinearGradient(0,150,0,520);sg.addColorStop(0,rgba(A,.9));sg.addColorStop(1,rgba(B,.5));c.fillStyle=sg;c.beginPath();c.arc(1250,360,170,0,7);c.fill();
// three skyline layers with different parallax values (the camera is shown panned right by 120 px)
const cam=120;
skyline(mix(BG1,B,.18),700,120,180,50,90,cam*0.3);
skyline(mix(BG1,B,.34),820,140,260,60,100,cam*0.6);
skyline(mix(BG0,A,.22),960,160,330,70,120,cam*1.0);
// window lights on the front layer
c.fillStyle=rgba('#FFE14D',.5);seed=3;for(let i=0;i<110;i++){c.fillRect(rnd()*1920,700+rnd()*340,8,5);}
// dim layer like DIM 35 percent
c.fillStyle=rgba(BG0,.35);c.fillRect(0,0,1920,1080);
// guide lines showing the layers
c.font='400 20px ShareTech';
const lab=[['LAYER 1  PARALLAX 0.3  (FAR)',560],['LAYER 2  PARALLAX 0.6',680],['LAYER 3  PARALLAX 1.0  (NEAR)',830]];
lab.forEach(([t,y])=>{c.fillStyle=rgba(BG0,.8);c.fillRect(60,y-22,c.measureText(t).width+24,32);c.fillStyle=TEXT;c.fillText(t,72,y);c.strokeStyle=rgba(TEXT,.5);c.setLineDash([8,8]);c.beginPath();c.moveTo(60,y+14);c.lineTo(1860,y+14);c.stroke();c.setLineDash([]);});
// a bit of HUD on top: clock
c.font='700 40px Orbitron';c.fillStyle=TEXT;const t='21:47';c.fillText(t,1920-c.measureText(t).width-60,70);
c.font='400 20px ShareTech';c.fillStyle=rgba(TEXT,.85);
c.fillText('A LAYERED WALLPAPER: NEAR LAYERS MOVE FURTHER WITH THE CAMERA THAN FAR ONES. THE EXAMPLE PACK IS BUILT THIS WAY.',60,970);
});
</script></body></html>

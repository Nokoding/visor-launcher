<!doctype html>
<html><head><meta charset="utf-8"><title>Deck 2.6 REMAP tab design mock</title>
<style>
  @font-face{font-family:"Orbitron";font-weight:700;src:url(../../assets/fonts/orbitron-bold.ttf)}
  @font-face{font-family:"OrbitronM";font-weight:500;src:url(../../assets/fonts/orbitron-medium.ttf)}
  @font-face{font-family:"Rajdhani";font-weight:600;src:url(../../assets/fonts/rajdhani-semibold-latin.ttf)}
  @font-face{font-family:"ShareTech";font-weight:400;src:url(../../assets/fonts/share-tech-mono.ttf)}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07040D}
  canvas{position:absolute;left:0;top:0}
  #mocktag{position:absolute;left:0;top:1032px;width:1920px;text-align:center;font:400 26px "ShareTech",monospace;color:#07040D}
  #mocktag span{background:#FFE14D;padding:6px 22px;border:3px solid #07040D;outline:2px solid #FFE14D}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="mocktag"><span>DESIGN MOCK (2.6 REMAP TAB, EXAMPLE RULES), NOT A SCREENSHOT OF THE APK</span></div>
<script>
// Same layout numbers as Panel.java for the centered Setup panel (SYNTHWAVE theme, gamepad hints):
// panel 1240 wide with eight tabs (2.6), header 108, tabs 66, rows 70, footer 70 plus one 34 px help line (2.5).
const A='#FF2E97', B='#A855F7', TEXT='#F4EEFF', DIM='#A99DC6', PANEL='#120A21', BG0='#07040D', BG1='#170A2C';
const c = document.getElementById('c').getContext('2d');
Promise.all(['700 29px Orbitron','600 31px Rajdhani','400 17px ShareTech','500 16px OrbitronM'].map(f=>document.fonts.load(f))).then(draw, draw);
function draw(){
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const m=s=>Math.round(((x>>s)&255)*(1-t)+((y>>s)&255)*t);return `rgb(${m(16)},${m(8)},${m(0)})`;}
function cut(l,t,r,b,big,small){const m=Math.min(r-l,b-t)*0.45;big=Math.min(big,m);small=Math.min(small,m);
  c.beginPath();c.moveTo(l+big,t);c.lineTo(r-small,t);c.lineTo(r,t+small);c.lineTo(r,b-big);c.lineTo(r-big,b);c.lineTo(l+small,b);c.lineTo(l,b-small);c.lineTo(l,t+big);c.closePath();}

const g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,BG1);g.addColorStop(1,BG0);c.fillStyle=g;c.fillRect(0,0,1920,1080);
let seed=11;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
c.fillStyle=mix(mix(BG1,B,.22),BG0,.25);for(let x=0;x<1920;){const w=40+rnd()*90,h=120+rnd()*260;c.fillRect(x,820-h,w-6,h+260);x+=w;}
c.fillStyle=rgba(BG0,0.78);c.fillRect(0,0,1920,1080);

const tabs=['LOOK','MOTION','ANIMATIONS','SOUND','PAD','APPS','SYSTEM','REMAP'], curTab=7;
const rows=[['CHANNEL UP','SHORT: VOLUME UP  >'],['CHANNEL DOWN','SHORT: VOLUME DOWN  >'],['TV BUTTON','SHORT: OPEN DECK HOME  LONG: SCREENSHOT  >'],['INPUT BUTTON','DEFAULT  >'],['ACCOUNT SWITCHER','SHORT: LAUNCH APP NETFLIX  >'],['LEARN A BUTTON','>'],['GUIDE','LONG: RECENTS  >'],['REMAP OUTSIDE DECK','OFF, NEEDS THE OVERLAY SERVICE']];
const foc=2, disabled={};
const pw=1240,headH=108,tabH=66,rowH=70,helpH=34,footH=70,ph=headH+tabH+rows.length*rowH+footH+helpH,px=340,py=(1080-ph)/2;
cut(px,py,px+pw,py+ph,34,10);c.fillStyle=rgba(PANEL,.97);c.fill();c.strokeStyle=rgba(A,.65);c.lineWidth=2;c.stroke();
const x0=px+44,x1=px+pw-44,hy=py+68;
c.font='700 29px Orbitron';c.fillStyle=A;c.fillText('//',x0,hy);const sl=c.measureText('// ').width;c.fillStyle=TEXT;c.fillText('DECK SETUP',x0+sl,hy);
c.font='400 17px ShareTech';c.fillStyle=DIM;const bk='BACK TO CLOSE';c.fillText(bk,x1-c.measureText(bk).width,hy-4);
c.strokeStyle=rgba(DIM,.3);c.lineWidth=1;c.beginPath();c.moveTo(x0,py+headH-14);c.lineTo(x1,py+headH-14);c.stroke();
// tabs
const tw=(pw-88-10*(tabs.length-1))/tabs.length;
tabs.forEach((n,i)=>{const l=x0+i*(tw+10),t=py+headH;cut(l,t,l+tw,t+46,12,4);if(i===curTab){c.fillStyle=A;c.fill();}else{c.strokeStyle=rgba(A,.5);c.lineWidth=1.5;c.stroke();}
  c.font='500 16px OrbitronM';c.fillStyle=i===curTab?BG0:DIM;c.fillText(n,l+tw/2-c.measureText(n).width/2,t+29);});
// rows
rows.forEach(([lab,val],i)=>{const top=py+headH+tabH+i*rowH,l=px+28,r=px+pw-28,tt=top+6,bb=top+rowH-6,cy=(tt+bb)/2,f=i===foc,dis=!!disabled[i];
  c.font='600 31px Rajdhani';c.fillStyle=dis?rgba(DIM,f?.75:.5):(f?TEXT:rgba(TEXT,.74));c.fillText(lab,l+20,cy+11);
  c.font='700 25px ShareTech';c.fillStyle=dis?rgba(DIM,.6):(f?A:DIM);
  if(val.endsWith('  >')){const v=val.slice(0,-3);c.fillStyle=f?A:DIM;c.fillText(v,r-20-c.measureText('>').width-14-c.measureText(v).width,cy+9);c.fillStyle=A;c.fillText('>',r-20-c.measureText('>').width,cy+9);}
  else if(val==='>'){c.fillStyle=dis?rgba(DIM,.6):A;c.fillText('>',r-20-c.measureText('>').width,cy+9);}
  else if(val[0]==='S'){const on=Math.round(+val.slice(1)/100*18),bw=250,seg=bw/18,vw=c.measureText('50').width,bx=r-20-vw-18-bw;
    for(let s=0;s<18;s++){c.fillStyle=s<on?rgba(A,dis?.4:1):rgba(DIM,.25);c.fillRect(bx+s*seg,cy-8,seg-3,16);}
    c.fillStyle=dis?rgba(DIM,.6):DIM;c.fillText('50',r-20-vw,cy+9);}
  else c.fillText(val,r-20-c.measureText(val).width,cy+9);
  if(i<rows.length-1){c.strokeStyle=rgba(DIM,.3);c.lineWidth=1;c.beginPath();c.moveTo(l,bb+6);c.lineTo(r,bb+6);c.stroke();}
  if(f){c.strokeStyle=A;c.lineWidth=2.5;const b=16;[[l,tt,1,1],[r,tt,-1,1],[l,bb,1,-1],[r,bb,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x+b*sx,y);c.lineTo(x,y);c.lineTo(x,y+b*sy);c.stroke();});c.lineWidth=1;}
});
// scrollbar
{const top=py+headH+tabH+6,h=8*rowH-12,n=12,th=h*8/n,ty=top;c.fillStyle=rgba(DIM,.25);c.fillRect(px+pw-18,top,4,h);c.fillStyle=A;c.fillRect(px+pw-18,ty,4,th);}
// footer: the help line (new in 2.5), then the controller hints
const help='SETS WHAT THE TV BUTTON DOES, ON A SHORT PRESS AND ON A LONG PRESS.';
const fy=py+ph-28, hyl=fy-34, cw=10.2, view=x1-x0;
c.font='400 17px ShareTech';
c.save();c.beginPath();c.rect(x0,hyl-24,view,32);c.clip();
const off=0;   // this sentence fits, so it stays still
c.fillStyle=rgba(TEXT,.86);c.fillText(help,x0-off,hyl);
c.restore();
// hints with button glyphs
function btn(x,l,col){c.strokeStyle=rgba(TEXT,.85);c.lineWidth=2;c.beginPath();c.arc(x+13,fy-6,13,0,7);c.stroke();c.fillStyle=TEXT;c.font='700 14px ShareTech';c.fillText(l,x+13-c.measureText(l).width/2,fy-1);return 26+8;}
let x=x0;c.font='400 17px ShareTech';
x+=btn(x,'A');c.fillStyle=DIM;c.font='400 17px ShareTech';c.fillText('SELECT',x,fy);x+=c.measureText('SELECT').width+30;
x+=btn(x,'B');c.fillStyle=DIM;c.font='400 17px ShareTech';c.fillText('BACK',x,fy);x+=c.measureText('BACK').width+30;
x+=btn(x,'LB')-8+14;x+=btn(x,'RB');c.fillStyle=DIM;c.font='400 17px ShareTech';c.fillText('TABS',x,fy);
// annotation
c.font='400 20px ShareTech';c.fillStyle=rgba(TEXT,.8);
c.fillText('THE REMAP TAB: THE FIVE REMOTE BUTTONS FIRST, THEN LEARNED BUTTONS. ADVANCED REMAP IS THE LAST ROW (SCROLLED OFF HERE).',px,py+ph+44);
}
</script>
</body></html>

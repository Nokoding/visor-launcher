<!doctype html>
<html><head><meta charset="utf-8"><title>Deck 2.8 control center design mock</title>
<style>
  @font-face{font-family:"Orbitron";font-weight:700;src:url(../../assets/fonts/orbitron-bold.ttf)}
  @font-face{font-family:"OrbitronM";font-weight:500;src:url(../../assets/fonts/orbitron-medium.ttf)}
  @font-face{font-family:"Rajdhani";font-weight:600;src:url(../../assets/fonts/rajdhani-semibold-latin.ttf)}
  @font-face{font-family:"ShareTech";font-weight:400;src:url(../../assets/fonts/share-tech-mono.ttf)}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07040D}
  canvas{position:absolute;left:0;top:0}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="mock27.js"></script>
<script>
// Same layout numbers as QuickMenu.java (2.8): panel 960 wide at the right edge (right edge x 1824), head 100,
// strip 58, seven rows of 84, footer 92. Pages: quick, apps, actions.
const page=(new URLSearchParams(location.search)).get('p')||'quick';
fonts(function(){
sky(); skyline(mix(BG1,B,.22),820,120,260,40,90,0);
// a game behind the menu
c.fillStyle=rgba('#1c6b3a',.55);c.fillRect(0,300,1920,780);c.fillStyle=rgba('#0b2a18',.8);for(let i=0;i<14;i++){c.fillRect(80+i*130,560-((i*37)%90),70,520);}
c.fillStyle=rgba(BG0,0.55);c.fillRect(0,0,1920,1080);
const pw=960,HEAD=100,STRIP=58,ROW=84,FOOT=92,VIS=7;
const ph=HEAD+STRIP+12+ROW*VIS+FOOT, px=1824-pw, py=Math.max(30,(1080-ph)/2);
cut(px,py,px+pw,py+ph,30,10);c.fillStyle=rgba(PANEL,.97);c.fill();c.strokeStyle=rgba(A,.7);c.lineWidth=2;c.stroke();
const x0=px+40,x1=px+pw-40,hy=py+62;
c.font='700 26px Orbitron';c.fillStyle=A;c.fillText('//',x0,hy);const sl=c.measureText('// ').width;c.fillStyle=TEXT;c.fillText('CONTROL CENTER',x0+sl,hy);
c.font='400 17px ShareTech';c.fillStyle=DIM;
const tagt=page==='actions'?'KILLED ROBLOX':'PS BUTTON';c.fillText(tagt,x1-c.measureText(tagt).width,hy-3);
c.strokeStyle=rgba(DIM,.3);c.lineWidth=1;c.beginPath();c.moveTo(x0,py+HEAD-14);c.lineTo(x1,py+HEAD-14);c.stroke();
const tabs=['QUICK','APPS','DISPLAY','CONTROLLER','SOUND','SYSTEM'];const cur=page==='quick'?0:1;
const tw=(x1-x0-8*5)/6;
tabs.forEach((n,i)=>{const l=x0+i*(tw+8),t=py+HEAD;cut(l,t,l+tw,t+46,10,3);if(i===cur&&page!=='actions'){c.fillStyle=A;c.fill();}else{c.strokeStyle=rgba(A,.5);c.lineWidth=1.5;c.stroke();if(i===cur){c.fillStyle=rgba(A,.35);c.fill();}}
  c.font='700 15px Orbitron';c.fillStyle=(i===cur&&page!=='actions')?BG0:DIM;c.fillText(n,l+tw/2-c.measureText(n).width/2,t+29);});
const gt=py+HEAD+STRIP+12, full=pw-48, cw=(full-12)/2, gl=px+24;
function brackets(l,t,r,b){c.strokeStyle=A;c.lineWidth=2.5;const a=14;[[l,t,1,1],[r,t,-1,1],[l,b,1,-1],[r,b,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x+a*sx,y);c.lineTo(x,y);c.lineTo(x,y+a*sy);c.stroke();});}
function tile(row,col,span,label,val,o){o=o||{};const x=span===2?gl:gl+col*(cw+12),w=span===2?full:cw,y=gt+row*ROW+4,h=ROW-8;
  cut(x,y,x+w,y+h,14,4);
  if(o.on){c.fillStyle=rgba(A,.30);c.fill();c.strokeStyle=rgba(A,.9);c.lineWidth=1.5;c.stroke();}else{c.fillStyle=rgba(BG0,.8);c.fill();c.strokeStyle=rgba(A,.5);c.lineWidth=1.2;c.stroke();}
  if(o.focus){c.fillStyle=rgba(A,.16);c.fill();}
  c.globalAlpha=o.dis?0.4:1;
  c.font='600 28px Rajdhani';c.fillStyle=o.focus?TEXT:rgba(TEXT,.8);c.fillText(label,x+18,y+h/2+10);
  c.font='700 21px ShareTech';c.fillStyle=(o.focus||o.on)?A:DIM;if(val)c.fillText(val,x+w-18-c.measureText(val).width,y+h/2+8);
  c.globalAlpha=1;if(o.focus)brackets(x,y,x+w,y+h);}
function slider(row,label,val,lit){const x=gl,w=full,y=gt+row*ROW+4,h=ROW-8;cut(x,y,x+w,y+h,14,4);c.fillStyle=rgba(BG0,.8);c.fill();c.strokeStyle=rgba(A,.5);c.lineWidth=1.2;c.stroke();
  c.font='600 28px Rajdhani';c.fillStyle=rgba(TEXT,.8);c.fillText(label,x+18,y+34);c.font='700 21px ShareTech';c.fillStyle=DIM;c.fillText(val,x+w-18-c.measureText(val).width,y+32);
  const bw=w-36,seg=bw/20;for(let q=0;q<20;q++){c.fillStyle=q<lit?A:rgba(DIM,.25);c.fillRect(x+18+q*seg,y+h-26,seg-4,10);}}
function header(row,l,r){c.font='400 17px ShareTech';c.fillStyle=DIM;const y=gt+row*ROW+ROW/2+6;c.fillText(l,gl+18,y);c.fillText(r,gl+full-18-c.measureText(r).width,y);}
let help='';
if(page==='quick'){
  slider(0,'VOLUME','VOL 11 OF 15',14);
  tile(1,0,1,'MUTE','OFF');tile(1,1,1,'PLAY PAUSE','',{focus:true});
  tile(2,0,1,'NEXT','');tile(2,1,1,'PREVIOUS','');
  tile(3,0,1,'SCREENSHOT','');tile(3,1,1,'SLEEP','');
  tile(4,0,1,'HOME','');tile(4,1,1,'BACK','');
  tile(5,0,1,'RECENTS','');tile(5,1,1,'DECK HOME','');
  help='SENDS PLAY OR PAUSE TO WHATEVER IS PLAYING.';
}else if(page==='apps'){
  header(0,'RUNNING APPS','');
  const apps=[['ROBLOX','IN FRONT',1],['YOUTUBE','3 MIN AGO',0],['NETFLIX','2 H AGO',0],['PRIME VIDEO','5 H AGO',0],['SPOTIFY','1 D AGO',0]];
  apps.forEach((a,i)=>{const y=gt+(i+1)*ROW+4,h=ROW-8;const f=i===1;cut(gl,y,gl+full,y+h,14,4);c.fillStyle=rgba(BG0,.8);c.fill();c.strokeStyle=rgba(A,.5);c.lineWidth=1.2;c.stroke();if(f){c.fillStyle=rgba(A,.16);c.fill();}
    c.fillStyle=rgba(B,.5);c.fillRect(gl+14,y+10,h-20,h-20);c.font='600 28px Rajdhani';c.fillStyle=f?TEXT:rgba(TEXT,.8);c.fillText(a[0],gl+14+h-20+18,y+h/2+10);
    c.font='700 21px ShareTech';c.fillStyle=a[2]?A:DIM;c.fillText(a[1],gl+full-18-c.measureText(a[1]).width,y+h/2+8);if(i===0){c.font='400 15px ShareTech';c.fillStyle=DIM;c.fillText('PROTECTED',gl+full-18-c.measureText('PROTECTED').width,y+h-8);}if(f)brackets(gl,y,gl+full,y+h);});
  tile(6,0,2,'CLOSE ALL BACKGROUND','');
  help='OK OPENS THIS APP\'S ACTIONS: KILL, FORCE STOP, OPEN, APP INFO.';
}else{
  header(0,'YOUTUBE','');
  [['KILL BACKGROUND','',0],['FORCE STOP','PRESS AGAIN TO CONFIRM',1],['OPEN','',0],['APP INFO','',0],['GAME PROFILE','',0],['SHOW ADB COMMAND','',0]].forEach((a,i)=>tile(i+1,0,2,a[0],a[1],{focus:a[2]===1}));
  help='EXPERIMENTAL: OPENS THE APP\'S APP INFO PAGE AND PRESSES FORCE STOP FOR YOU. NEEDS THE OVERLAY SERVICE.';
}
c.strokeStyle=rgba(DIM,.3);c.lineWidth=1;const hl=py+ph-52;c.beginPath();c.moveTo(x0,hl-26);c.lineTo(x1,hl-26);c.stroke();
c.font='400 17px ShareTech';c.fillStyle=rgba(TEXT,.86);c.fillText(help,x0,hl);c.fillStyle=DIM;c.fillText('A SELECT   B BACK   LB RB SECTIONS',x0,py+ph-22);
tag('DESIGN MOCK (2.8 CONTROL CENTER, EXAMPLE APPS), NOT A SCREENSHOT OF THE APK');
});
</script></body></html>
